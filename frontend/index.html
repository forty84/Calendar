<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Локальный календарь</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/calendar.css" />
</head>
<body>
  <!-- Верхняя панель (Header) -->
  <header class="app-header">
    <div class="header-left">
      <div class="app-logo">
        <svg class="icon-logo" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span class="app-title">Календарь</span>
      </div>

      <button id="btn-today" class="btn btn-outlined">Сегодня</button>

      <div class="nav-arrows">
        <button id="btn-prev" class="btn-icon" title="Назад">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <button id="btn-next" class="btn-icon" title="Вперёд">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>

      <h1 id="current-period-title" class="period-title">Октябрь 2026</h1>
    </div>

    <div class="header-center">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          type="text"
          id="search-input"
          placeholder="Поиск событий по названию или месту..."
          autocomplete="off"
        />
        <button id="btn-clear-search" class="btn-icon hidden" title="Очистить поиск">&times;</button>
      </div>
    </div>

    <div class="header-right">
      <span id="runtime-mode-badge" class="mode-badge">Режим</span>
      <div class="view-switcher" role="group" aria-label="Режим просмотра">
        <button class="btn-view" data-view="day">День</button>
        <button class="btn-view active" data-view="week">Неделя</button>
        <button class="btn-view" data-view="month">Месяц</button>
      </div>
    </div>
  </header>

  <!-- Основная рабочая область -->
  <div class="app-body">
    <!-- Левый сайдбар -->
    <aside class="app-sidebar">
      <button id="btn-create-event" class="btn-create">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Создать</span>
      </button>

      <!-- Мини-календарь -->
      <div class="mini-calendar">
        <div class="mini-cal-header">
          <span id="mini-cal-title" class="mini-cal-title">Октябрь 2026</span>
          <div class="mini-cal-nav">
            <button id="mini-prev" class="btn-icon-sm" title="Предыдущий месяц">&#8249;</button>
            <button id="mini-next" class="btn-icon-sm" title="Следующий месяц">&#8250;</button>
          </div>
        </div>
        <div class="mini-cal-weekdays">
          <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
        </div>
        <div id="mini-cal-grid" class="mini-cal-grid"></div>
      </div>

      <!-- Блок напоминаний / ближайших событий -->
      <div class="upcoming-section">
        <h3 class="sidebar-heading">Ближайшие напоминания</h3>
        <div id="upcoming-list" class="upcoming-list">
          <p class="empty-hint">Нет ближайших напоминаний</p>
        </div>
      </div>
    </aside>

    <!-- Главная область календаря -->
    <main class="calendar-main">
      <!-- Панель результатов поиска (показывается при активном поиске) -->
      <div id="search-results-panel" class="search-results-panel hidden">
        <div class="search-results-header">
          <h2>Результаты поиска</h2>
          <button id="btn-close-search" class="btn btn-outlined">Вернуться к календарю</button>
        </div>
        <div id="search-results-list" class="search-results-list"></div>
      </div>

      <!-- Контейнер сетки календаря (День / Неделя / Месяц) -->
      <div id="calendar-viewport" class="calendar-viewport"></div>
    </main>
  </div>

  <!-- Модальное окно создания / редактирования события -->
  <div id="event-modal-backdrop" class="modal-backdrop hidden">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 id="modal-title">Новое событие</h2>
        <button id="btn-close-modal" class="btn-icon" title="Закрыть">&times;</button>
      </div>

      <form id="event-form" class="modal-body">
        <input type="hidden" id="event-id" />

        <div class="form-group">
          <input
            type="text"
            id="event-title"
            class="input-title"
            placeholder="Добавьте название"
